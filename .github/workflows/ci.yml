name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LegiVellum (canonical protocol package)
        uses: actions/checkout@v4
        with:
          repository: PStryder/LegiVellum
          path: _legivellum
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Canonical protocol package first. It is a hard dependency and is
          # not published to an index, so it comes from the sibling checkout.
          python -m pip install -e ./_legivellum
          python -m pip install -e ".[dev]"

      - name: Dependency health
        run: python -m pip check

      - name: Compile check
        run: python -m compileall -q src/delegate

      - name: Ruff (full repo)
        run: ruff check src/delegate --select E9,F63,F7,F82

      - name: Mypy (full repo)
        run: python -m mypy --config-file .mypy-ci.ini src/delegate

      - name: Run tests with coverage gate
        run: |
          pytest -q --maxfail=1 \
            --cov=delegate \
            --cov-report=term \
            --cov-fail-under=40

      - name: Docker build
        run: docker build -t delegate-ci .