[project]
name = "delegate"
version = "0.1.0"
description = "Pure planning and capability brokering for LegiVellum - intent to structured execution plans"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - Technomancy Labs"}
authors = [
    {name = "Technomancy Labs"}
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "mcp>=1.0.0",
    "python-ulid>=2.2.0",
    # Canonical receipt protocol. Hard dependency: this gate must not be able
    # to start without the validator, and must never fall back to posting
    # unvalidated dictionaries to the ledger.
    "legivellum",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    # Pinned. `ruff>=0.1.0` let CI resolve a newer ruff than local, so the
    # gate flagged rules that pass here and CI failed on unchanged code.
    # A lint gate whose rule set moves under you is not a gate.
    "ruff>=0.14.0,<0.15.0",
    "mypy>=1.5.0,<2.0.0",
]

[project.scripts]
delegate = "delegate.main:main"
delegate-mcp = "delegate.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delegate"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# legivellum is the sibling protocol package, not published to an index.
[tool.uv.sources]
legivellum = { path = "../LegiVellum", editable = true }
